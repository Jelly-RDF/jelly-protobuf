syntax = "proto3";
package eu.ostrzyciel.jelly.core.proto.v1;

// EXPERIMENTAL FEATURE -- the API and format may change.

// Messages shared by the newer Jelly formats, in preparation for the RDF 1.2
// version of Jelly.

import "rdf.proto";

// Packed entries of a lookup table (name, prefix, or datatype).
//
// Lookup entries are almost always assigned consecutive identifiers, because
// that is what the "id = 0 means previous_id + 1" rule of the unpacked entries
// optimizes for. A packed entry states the identifier once and then lists the
// values of a whole run of consecutive entries, saving the framing of every
// entry after the first.
//
// The identifier of the first value follows the same rule as the unpacked
// entries: 0 means previous_id + 1, or 1 at the start of the stream. Every
// following value takes the identifier of the previous one plus 1.
//
// A packed entry with no values at all is a no-op and must not be written.
message RdfLookupEntryPacked {
  // 1-based identifier of the first value.
  // If id=0, it should be interpreted as previous_id + 1.
  // If id=0 appears in the first entry of a given lookup table in the
  // stream, it should be interpreted as 1.
  uint32 id = 1;
  // Values of the lookup entries (UTF-8 encoded), for consecutive
  // identifiers starting at id.
  repeated string values = 2;
}

// Version of RDF that a stream conforms to, following the version labels of
// RDF 1.2 Concepts:
// https://www.w3.org/TR/rdf12-concepts/#defined-version-labels
//
// Each version includes the ones listed before it: RDF 1.1 data is valid
// RDF 1.2 Basic data, which is valid RDF 1.2 data.
enum RdfVersion {
  // Unspecified. Each format that uses this enum defines how to interpret it.
  RDF_VERSION_UNSPECIFIED = 0;
  // RDF 1.1 (version label "1.1"): no triple terms, no base directions.
  RDF_VERSION_1_1 = 1;
  // RDF 1.2 Basic (version label "1.2-basic"): base directions are allowed,
  // triple terms are not.
  RDF_VERSION_1_2_BASIC = 2;
  // RDF 1.2 (version label "1.2"): base directions and triple terms are
  // allowed.
  RDF_VERSION_1_2 = 3;
}

// Initial text direction of a language-tagged string (RDF 1.2).
enum RdfBaseDirection {
  // No base direction: an ordinary language-tagged string (rdf:langString).
  RDF_BASE_DIRECTION_UNSPECIFIED = 0;
  // Left-to-right ("ltr"): a directional language-tagged string
  // (rdf:dirLangString).
  RDF_BASE_DIRECTION_LTR = 1;
  // Right-to-left ("rtl"): a directional language-tagged string
  // (rdf:dirLangString).
  RDF_BASE_DIRECTION_RTL = 2;
}

// RDF literal, with support for the RDF 1.2 base direction.
//
// Fields 1–3 are the same as in RdfLiteral (rdf.proto), so every valid
// RdfLiteral message is also a valid RdfLiteral2 message with no base
// direction, and the other way round.
// TODO (RDF 1.2): unify this!
message RdfLiteral2 {
  // The lexical form of the literal (required).
  string lex = 1;

  // Literal kind – at most one of these field may be set.
  // If none is set, then it's a simple literal.
  oneof literalKind {
    // Language-tagged string.
    string langtag = 2;
    // Typed literal. The datatype is a reference to an entry in the
    // datatype lookup. This value is 1-based and the value of 0
    // is invalid (in contrast to prefix_id and name_id in RdfIri).
    //
    // Must not refer to rdf:langString or rdf:dirLangString – use langtag
    // and direction instead.
    uint32 datatype = 3;
  }

  // Base direction of a language-tagged string.
  // Must not be set unless langtag is set.
  RdfBaseDirection direction = 4;
}

// RDF 1.2 triple term.
//
// This message can only represent triples that are
// valid in RDF 1.2: the subject is an IRI or a blank node, the predicate is
// an IRI, and only the object may be a nested triple term. There are no
// repeated terms: every position must be set.
//
// The field numbers are the same as in RdfTriple.
message RdfTripleTerm {
  // Subject (required).
  oneof subject {
    // IRI
    RdfIri s_iri = 1;
    // Blank node
    string s_bnode = 2;
  }

  // Predicate (required).
  RdfIri p_iri = 5;

  // Object (required).
  oneof object {
    // IRI
    RdfIri o_iri = 9;
    // Blank node
    string o_bnode = 10;
    // Literal
    RdfLiteral2 o_literal = 11;
    // Nested triple term
    RdfTripleTerm o_triple_term = 12;
  }
}
