syntax = "proto3";
package eu.ostrzyciel.jelly.core.proto.v1.sparql;

// Jelly-SPARQL: binary serialization for SPARQL query results
// (solution sequences and boolean ASK results), based on the Jelly-RDF term
// encoding (rdf.proto).
//
// The results are transmitted as a stream of frames. Each frame contains a
// batch of solutions (rows) in a columnar layout: one column per variable.
// The columns (RdfColumn) and their sequence layout encoding are defined in
// rdf.proto, and shared with the column layout of Jelly-RDF.
//
// The first frame has the header: stream options and the variable names, one
// per column. The stream ends with a trailer, which says whether the result
// set is complete.
//
// By default, a stream contains one result set (SPARQL_STREAM_TYPE_FLAT). A
// stream of type SPARQL_STREAM_TYPE_PUNCTUATED contains a sequence of result
// sets instead, each ended by a trailer.

import "rdf2.proto";

// Stream options for SPARQL result streams.
message SparqlResultsOptions {
  // Name of the stream (completely optional).
  // This may be used for, e.g., topic names in a pub/sub system.
  string stream_name = 1;
  // Type of the stream: one result set, or a sequence of result sets.
  // Optional. Defaults to SPARQL_STREAM_TYPE_FLAT.
  // Must be the same in every options message of the stream.
  SparqlStreamType stream_type = 2;
  // Version of RDF whose terms may occur in the stream.
  //   RDF_VERSION_1_1       – no triple terms, no base directions
  //   RDF_VERSION_1_2_BASIC – base directions, no triple terms
  //   RDF_VERSION_1_2       – base directions and triple terms
  // Unspecified (the default) means that no version is announced: the stream
  // may contain any RDF 1.2 term. Values not listed here are invalid.
  RdfVersion rdf_version = 5;
  // Maximum size of the name lookup table
  // (required, must be >= 128)
  uint32 max_name_table_size = 9;
  // Maximum size of the prefix lookup table
  // (required if the prefix lookup is used)
  uint32 max_prefix_table_size = 10;
  // Maximum size of the datatype lookup table
  // (required if datatype literals are used)
  uint32 max_datatype_table_size = 11;
  // Protocol version (required)
  // For this proposal, the value must be 1.
  // For custom extensions, the value must be 10000 or higher.
  uint32 version = 15;
}

// Type of a SPARQL result stream.
enum SparqlStreamType {
  // The entire stream is a single result set. This is the default.
  // protolint:disable:next ENUM_FIELD_NAMES_ZERO_VALUE_END_WITH
  SPARQL_STREAM_TYPE_FLAT = 0;
  // The stream is a sequence of result sets, each ended by a frame with a
  // trailer. A result set may span multiple frames, and each frame belongs to
  // exactly one result set. The result sets are independent of each other
  // (they may have different variables, and mix solution sequences with
  // boolean results), but the lookup tables are kept from one to the next.
  // Blank node labels are scoped to one result set.
  SPARQL_STREAM_TYPE_PUNCTUATED = 1;
}

// Boolean result of a SPARQL ASK query.
message SparqlAskResult {
  // The boolean value of the result.
  bool value = 1;
}

// End-of-result-set marker, saying whether the result set is complete.
//
// Producers must write a trailer in the last frame of every result set,
// unless they cannot write anything more at all (for example, because the
// process died).
//
// In a FLAT stream, the trailer ends the stream: a frame containing a trailer
// must not be followed by any frame that does not include the stream options.
// In a PUNCTUATED stream, the frame after a trailer starts a new result set.
message SparqlResultsTrailer {
  // Empty (the default) means the result set is complete.
  // A non-empty value is a human-readable explanation of why the producer
  // could not complete the result set (e.g., query failure mid-evaluation).
  string error = 1;
}

// SPARQL results frame – base message of a SPARQL result stream.
//
// A frame contains a batch of rows (solutions). A frame must contain either
// exactly one column for each variable of the header, or no columns at all.
// The no-columns form is only valid when row_count is 0 (or the result set
// has no variables), and is the recommended encoding for a frame with no
// rows. A column whose cells are all
// unbound in a frame is encoded as an empty message. Columns must decode to
// at most row_count cells each (shorter columns are padded with unbound
// cells – see the layout encoding).
//
// Frames are self-contained except for the lookup tables and the header:
// a frame can be decoded using only the lookup table state left by the
// preceding frames and the header of its result set.
message SparqlResultsFrame {
  // Stream options.
  // Must be set in the first frame of the stream.
  //
  // May be set again in a later frame. Doing so empties the lookup tables
  // (identifier numbering restarts at 1).
  //
  // In a FLAT stream, it also makes the header cease to be in effect, so the
  // same frame must restate it, with the same variables as the first frame.
  // Blank node labels are not reset. This is intended only for concatenating
  // result streams of the same query.
  //
  // In a PUNCTUATED stream, the options may be set again only in the first
  // frame of a result set.
  SparqlResultsOptions options = 1;
  // Result set header: the names of the variables of the result set, in
  // projection (SELECT clause) order, without the leading "?" or "$". Names
  // must not be empty. The i-th column of every frame of the result set holds
  // the values of the i-th variable.
  //
  // Must be set in the first frame of every result set with a solution
  // sequence, and in a frame that contains the options (see `options`). Must
  // not be set in any other frame. An empty variables list in such a frame
  // declares a zero-variable result set (row_count then conveys the number of
  // empty solutions).
  repeated string variables = 2;
  // Number of rows (solutions) in this frame (required).
  // Must not be greater than 2^27 - 1, the largest number of cells the
  // layout encoding can address.
  uint32 row_count = 3;
  // Entries in the name lookup table.
  // All lookup entries of a frame are applied, in order, before any column
  // of the frame is decoded. Consequently, every lookup id referenced by the
  // frame's columns must still hold the intended value after all entries are
  // applied: the working set of a single frame must fit in the lookup
  // tables.
  repeated RdfLookupEntryPacked names = 4;
  // Entries in the prefix lookup table. See `names` for ordering rules.
  //
  // Note: the prefixes in the lookup table can be arbitrary strings, and are
  // NOT meant to be user-facing. They are only used for IRI compression.
  // To transmit user-facing namespace declarations for cosmetic purposes, use
  // RdfNamespaceDeclaration.
  repeated RdfLookupEntryPacked prefixes = 5;
  // Entries in the datatype lookup table. See `names` for ordering rules.
  repeated RdfLookupEntryPacked datatypes = 6;
  // Columns, one per variable, in the order of `variables`.
  repeated SparqlColumn columns = 7;
  // Boolean (ASK) result.
  // If set, the result set is a boolean result instead of a solution
  // sequence. It may be set only in the first frame of a result set, which
  // must include no variables, no columns, and row_count = 0. A boolean
  // result is always the only frame of its result set.
  SparqlAskResult ask_result = 8;
  // End-of-result-set marker. See SparqlResultsTrailer.
  SparqlResultsTrailer trailer = 9;
  // Arbitrary metadata
  // The keys are UTF-8 encoded strings, the values are byte arrays.
  // The metadata does not affect the result data in any way, treat it
  // as comments in a text file.
  //
  // Well-known keys (their values must be valid UTF-8):
  //   link – zero or more IRIs separated by LF (U+000A), describing the
  //          result set as a whole (not the frame). Corresponds to head.link
  //          in the SPARQL Query Results JSON format.
  //
  // All other keys may be used by implementations in any way they see fit,
  // and their values are arbitrary bytes.
  map<string, bytes> metadata = 15;
}

// EXPERIMENT: a copy of RdfColumn from the new rdf.proto (same wire format)
message SparqlColumn {
  // Type of each run value, in row order, 2 bits per value, four values per
  // byte starting from the least significant bits:
  //   0 – IRI: the next value of name_ids (and prefix_ids)
  //   1 – literal: the next value of lex_values (and literal_kinds)
  //   2 – blank node: the next value of bnodes
  //   3 – triple term: the next value of triple_terms
  // kinds must have exactly ceil(values / 4) bytes, and the unused bits of
  // the last byte must be 0.
  //
  // Exception: if all run values are of one type (only one of the lists has
  // values), kinds may be empty. This is the usual case, e.g., a column of
  // IRIs only.
  bytes kinds = 1;
  // Sequence layout of the column, see above. Empty = every cell is bound,
  // no repeats.
  repeated uint32 layouts = 2;
  // Name identifiers of the IRIs of the column, in row order.
  //
  // The name_id inference rule of RdfIri applies along this list: 0 means
  // "previous name_id + 1", and the state resets at the start of every column
  // in every batch, where 0 means name_id = 1. Columns can therefore be
  // decoded independently of each other (given the lookup tables).
  repeated uint32 name_ids = 3;
  // Prefix identifiers of the IRIs of the column, in row order.
  //
  // The list must have one of three lengths:
  //   0                 – every IRI has prefix_id = 0 (no prefix), which is
  //                       the case when the prefix lookup is disabled
  //   1                 – every IRI uses this one prefix, which is the case
  //                       for IRIs sharing a namespace
  //   len(name_ids)     – one entry per IRI
  //
  // In the third form the prefix_id inference rule of RdfIri applies along the
  // list: 0 means "same prefix as the previous IRI", starting from 0.
  repeated uint32 prefix_ids = 4;
  // Lexical forms of the literals of the column, in row order.
  repeated string lex_values = 5;
  // Literal kind of each literal, parallel to lex_values:
  //   0          – simple literal (xsd:string)
  //   odd v      – literal with the datatype of datatype lookup id (v + 1) / 2
  //   even v > 0 – language-tagged string with language tag v / 2 - 1, an
  //                index into langtags
  //
  // The list must have one of three lengths:
  //   0                 – every literal is a simple literal
  //   1                 – every literal has this kind
  //   len(lex_values)   – one entry per literal
  //
  // A datatype must not be rdf:langString or rdf:dirLangString – use a
  // language tag instead. Simple literals do not need an xsd:string entry in
  // the datatype lookup.
  repeated uint32 literal_kinds = 6;
  // The language tags referred to by literal_kinds, in the order of first
  // use. Each should be a valid BCP 47 language tag. The same tag may appear
  // more than once, with different base directions.
  repeated string langtags = 7;
  // Base directions of the language tags (RdfBaseDirection numbers), parallel
  // to langtags. Empty means no base direction for any tag. A direction other
  // than RDF_BASE_DIRECTION_UNSPECIFIED is not valid if the stream options
  // declare RDF_VERSION_1_1.
  repeated uint32 langtag_directions = 8;
  // Labels of the blank nodes of the column, in row order.
  repeated string bnodes = 9;
  // The triple terms of the column, in row order.
  // Not valid if the stream options declare RDF_VERSION_1_1 or
  // RDF_VERSION_1_2_BASIC.
  //
  // The IRIs inside the triple terms share one RdfIri inference state, which
  // advances through them in order – subject, predicate, object, recursively
  // into nested triple terms. It is separate from the state of the IRIs of
  // the column (name_ids and prefix_ids), and resets at the start of every
  // column in every batch.
  repeated RdfTripleTerm triple_terms = 10;
}
